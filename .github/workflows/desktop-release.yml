name: Build desktop downloads

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
            args: --linux --x64
            executable: release/linux-unpacked/ainogo
          - os: windows-2025
            name: windows-x64
            args: --win --x64
            executable: release/win-unpacked/Ainogo.exe
          - os: macos-15
            name: mac-universal
            args: --mac --universal
            executable: release/mac-universal/Ainogo.app/Contents/MacOS/Ainogo
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Browser regression tests (Linux)
        if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Prepare virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb xauth
      - name: Native app smoke test (Linux)
        if: runner.os == 'Linux'
        run: AINOGO_TEST_NO_SANDBOX=1 xvfb-run -a npm run test:desktop
      - name: Native app smoke test (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Package offline app
        run: npm run package:desktop -- ${{ matrix.args }}
      - name: Test packaged executable (Linux)
        if: runner.os == 'Linux'
        env:
          AINOGO_PACKAGED_EXECUTABLE: ${{ matrix.executable }}
        run: AINOGO_TEST_NO_SANDBOX=1 xvfb-run -a node scripts/desktop-smoke.mjs
      - name: Test packaged executable (Windows/macOS)
        if: runner.os != 'Linux'
        env:
          AINOGO_PACKAGED_EXECUTABLE: ${{ matrix.executable }}
        run: node scripts/desktop-smoke.mjs
      - name: Test actual Windows installer and portable launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node scripts/checksums.mjs release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version"
          $env:AINOGO_RELEASE_TAG = "desktop-v$version"
          $env:AINOGO_DOWNLOAD_SOURCE = (Resolve-Path release).Path
          $env:AINOGO_DOWNLOAD_KIND = 'windows-installer'
          node scripts/verify-download.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:AINOGO_DOWNLOAD_KIND = 'windows-portable'
          node scripts/verify-download.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-${{ matrix.name }}
          compression-level: 0
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.AppImage
            release/*.tar.gz
            release/*.zip

  publish:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - run: node scripts/checksums.mjs release
      - name: Publish tested desktop preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          tag="desktop-v$version"
          gh release create "$tag" release/* --target "$GITHUB_SHA" --title "Ainogo $version desktop preview" --notes-file DESKTOP.md --prerelease --draft
          gh release edit "$tag" --draft=false --prerelease
