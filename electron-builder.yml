appId: io.github.kiefferjh.ainogo
productName: Ainogo
directories:
  output: release
asar: true
files:
  - desktop/**
  - dist-desktop/**
  - package.json
artifactName: Ainogo-${version}-${os}-${arch}.${ext}
linux:
  category: Education
  target:
    - AppImage
    - tar.gz
win:
  signExecutable: false
  target:
    - portable
    - nsis
nsis:
  artifactName: Ainogo-${version}-windows-${arch}-setup.exe
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
mac:
  category: public.app-category.education
  identity: '-'
  target:
    - zip
